# Timed Memories: a screensaver step of its own (plugin API 0.14). Shows a camera or image entity's
# snapshot full-screen with a caption computed from its taken_at attribute relative to a birthday.
# A tap button optionally runs a script or automation while standby stays on.
id: timed_memories
version: 0.3.2
api: "0.14"
icon: camera
maintainer: Knurtz
license: MIT
stage: beta
topics: [photos]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 4

permissions:
  home_assistant_actions:
    - script.turn_on
    - automation.trigger

savers:
  - id: snap
    name: saver_name
    icon: camera
    step: own
    memory: 800
    pictures: 1
    taps: true
    domains: [image, camera]
    attributes: [entity_picture, taken_at, date_taken, created_at, date, date_created]
    when: always
    example: saver_example
    options:
      - id: reference_date
        kind: text
        label: reference_date
        hint: reference_date_hint
      - id: button_action
        kind: text
        label: button_action
        hint: button_action_hint
        default: ""
      - id: button_icon
        kind: text
        label: button_icon
        hint: button_icon_hint
        default: ""
